<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="%THEME_COLOR%" />
		<!--
			globals.css only styles `body`, so without this the UA canvas paints white
			for the moment before the stylesheet lands. One theme ("Paper").
		-->
		<style>
			html {
				background: %THEME_COLOR%;
			}
		</style>
		<meta name="description" content="Qotm Web." />
		<!--
			Every route this app serves is private, so nothing here should be indexed.
			`robots.txt` only discourages crawling, while `noindex` prevents listing,
			so both belong in a deployment. This app's routes include password-reset
			and email-verify URLs.

			With the marketing site included this tag goes away: indexing is then
			decided per route by `PageMeta`, and the build emits a `noindex` of its own
			on any non-production origin. See vite.config.ts.
		-->
		<meta name="robots" content="noindex, nofollow" />
		<title>%APP_TITLE%</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="/site.webmanifest" />
		<link rel="alternate" type="application/rss+xml" title="qotm: latest" href="/feed.xml" />
		<link rel="alternate" type="application/rss+xml" title="qotm: curated" href="/curated.xml" />
		<meta name="theme-color" content="%THEME_COLOR%" />
		<!--
			globals.css only styles `body`, so without this the UA canvas paints white
			for the moment before the stylesheet lands. One theme ("Paper").
		-->
		<style>
			html {
				background: %THEME_COLOR%;
			}
			/*
				The server's crawler markup (server/prerender.ts) stays in the HTML but is
				not painted while the app loads; it shows after 4s only if the app never
				replaced it, and at once without JavaScript (the <noscript> below).
			*/
			main[data-prerender] {
				visibility: hidden;
				animation: prerender-reveal 0s 4s forwards;
			}
			@keyframes prerender-reveal {
				to {
					visibility: visible;
				}
			}
		</style>
		<noscript>
			<style>
				main[data-prerender] {
					visibility: visible;
					animation: none;
				}
			</style>
		</noscript>
		<meta
			name="description"
			content="qotm: one considered programming quote in your terminal, from a community that verifies and curates them."
		/>
		<!--
			Indexing is decided per route by `PageMeta`: the community pages are public,
			the account, admin and error pages pass `robots="noindex"`.
		-->
		<title>%APP_TITLE%</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
